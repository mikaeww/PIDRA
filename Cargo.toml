[package]
name = "pidra"
version = "0.1.0"
edition = "2024"
description = "Keyboard-first Linux terminal process manager"
license = "MIT"

[dependencies]
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rustix = { version = "1.1.4", features = ["param", "process"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
x11rb = "0.14.0"
zbus = "5.18.0"

[profile.release]
lto = "thin"
strip = true
